  <text x="600" y="144" text-anchor="middle" fill="#93c5fd" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="0.6">ML Engineer &amp; Applied AI Researcher</text>
